name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version_guard:
    name: Require version bump for functional changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version bump policy
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          HEAD_SHA="${{ github.sha }}"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No comparable base SHA found (likely first push). Skipping version guard."
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No changed files detected."
            exit 0
          fi

          EXEMPT_PATTERN='^(README\.md|LICENSE|\.gitignore|\.github/|.*\.md$)'
          RELEVANT_FILES=$(echo "$CHANGED_FILES" | grep -Ev "$EXEMPT_PATTERN" || true)

          if [[ -z "$RELEVANT_FILES" ]]; then
            echo "Only docs/meta/workflow changes detected. Version bump not required."
            exit 0
          fi

          if ! echo "$CHANGED_FILES" | grep -qx 'config.yaml'; then
            echo "Functional changes were detected, but config.yaml was not modified."
            echo "Please bump config.yaml version for Home Assistant update detection."
            exit 1
          fi

          VERSION_DIFF=$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- config.yaml | grep -E '^[+-]version:\s*"?.+"?$' || true)
          if [[ -z "$VERSION_DIFF" ]]; then
            echo "config.yaml changed but version line was not updated."
            echo "Please increment config.yaml version."
            exit 1
          fi

          echo "Version bump policy passed."

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    needs: version_guard
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Bytecode compile
        run: python -m compileall -q wyoming_openai_streamer

      - name: Build add-on image (amd64)
        run: docker build --build-arg BUILD_ARCH=amd64 -t wyoming-openai-streamer:test .
